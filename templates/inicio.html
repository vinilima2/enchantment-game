<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Enchantment Game</title>
    <link rel="stylesheet" type="text/css" href="../styles/inicio.css" />
</head>

<body>
    <header>
        <button id="botao-inicio" type="button" onclick="executarSomToque()">Início</button>
        <button id="botao-sair" type="button" onclick="executarSomToque()">Sair</button>
    </header>
    <main>
        <section id="selecao-personagem" class="tela-selecao">
            <h1>Escolha seu personagem</h1>
            <div class="selecao-jogador">
                <div class="cartao-personagem personagem-A" onclick="selecionarPersonagem(event)">
                    <img src="../assets/animacoes/personagem A/stand_personagemA.png" id="personagem-A" />
                    <h2 class="titulo">GreenWood</h2>
                </div>

                <div class="cartao-personagem personagem-B" onclick="selecionarPersonagem(event)">
                    <img src="../assets/animacoes/personagem B/stand_personagemB.png" id="personagem-B" />
                    <h2 class="titulo">Esmerald</h2>
                </div>

                <div class="cartao-personagem personagem-C" onclick="selecionarPersonagem(event)">
                    <img src="../assets/animacoes/personagem C/stand_personagemC.png" id="personagem-C" />
                    <h2 class="titulo">Blue Warrior</h2>
                </div>
            </div>
        </section>

        <section id="selecao-time" class="tela-selecao" hidden>
            <h1>Escolha seu produto</h1>
            <p class="subtitulo-selecao">Selecione o produto da seguradora para iniciar sua jornada.</p>
            <div class="lista-produtos" aria-label="Produtos disponíveis">
                <button class="produto-item produto-bare" type="button" data-turma="BARE" onclick="selecionarTime(event)">
                    <span class="simbolo-produto" aria-hidden="true">B</span>
                    <span class="produto-conteudo">
                        <span class="produto-status"><span class="status-ponto"></span>Disponível</span>
                        <strong>BARE</strong>
                        <span class="produto-descricao">Produto de atendimento e relacionamento</span>
                    </span>
                    <span class="produto-acao" aria-hidden="true">&rarr;</span>
                </button>
            </div>
            <button id="voltar-personagem" class="botao-voltar" type="button">Voltar</button>
        </section>
    </main>
    <script src="../scripts/inicio.js"></script>
</body>

</html>
